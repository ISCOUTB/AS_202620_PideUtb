name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# El job solo clona el repositorio y ejecuta pruebas: no necesita permisos de
# escritura. Se declara el mínimo en lugar de heredar los del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # PostgreSQL efímero contra el que corren las pruebas de repositorio.
    #
    # Existe porque hay **dos implementaciones** de cada repositorio —memoria y
    # PostgreSQL— y una sola de ellas se ejercitaría sin esto. Una aserción que
    # solo se comprueba contra memoria no dice nada del código que corre en
    # producción.
    #
    # La versión se fija (no `postgres:latest`) por el mismo motivo que el lock
    # de dependencias: una imagen que cambia sola convierte un fallo de CI en
    # una adivinanza sobre qué se movió.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: pideutb
          POSTGRES_DB: pideutb_pruebas
          # Sin contraseña, a propósito.
          #
          # La alternativa era escribir una aquí, y entonces habría una
          # credencial en el repositorio que nadie va a rotar nunca porque no
          # protege nada. Una contraseña que no se puede tomar en serio enseña
          # a no tomarse en serio las que sí importan.
          #
          # `trust` es seguro en este contexto concreto y solo en este: el
          # contenedor vive dentro del job, no se publica fuera de él, y se
          # destruye al terminar. Sus datos son la semilla de pruebas.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Sin esto, los pasos empiezan antes de que el motor acepte conexiones y
        # el primer test falla por una carrera, no por el código.
        options: >-
          --health-cmd "pg_isready -U pideutb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      # Se instala desde el lock con versiones exactas y hashes, y solo desde
      # wheels: la build es reproducible y ningún paquete ejecuta su setup.py
      # durante la instalación.
      # `requirements-calidad.txt` trae `pytest-cov`, que es instrumental de
      # medición y no una dependencia del producto. Se instala aquí porque la
      # cobertura se mide en este job: es el único que ejecuta las pruebas
      # contra PostgreSQL, y sin base de datos las ramas de los `repository.py`
      # quedan sin ejecutar y el porcentaje miente a la baja.
      - name: Instalar dependencias
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          pip install --require-hashes --only-binary=:all: -r requirements-calidad.txt

      # La variable se llama `..._PRUEBAS` y no `PIDEUTB_DATABASE_URL` a
      # propósito. Si las pruebas leyeran la misma que usa la aplicación,
      # bastaría con tenerla exportada —lo normal mientras se desarrolla contra
      # Supabase— para que la suite truncara las tablas de producción. La única
      # defensa fiable contra ese accidente es que el nombre no coincida.
      # `--cov-fail-under` convierte la cobertura en un umbral exigido, no en
      # un dato informativo.
      #
      # Existe por un hallazgo de la semana 9: la cobertura **nunca se había
      # medido**. El job `SonarCloud` de abajo la mide, pero se omite sin
      # `SONAR_TOKEN` y termina en verde, así que llevaba tres entregas sin
      # ejecutarse. Quien publicaba el análisis era el automático de
      # SonarCloud, que no corre las pruebas y por tanto no puede ingerir
      # cobertura (`docs/calidad-sonarcloud.md` §2). El README llegó a mostrar
      # una insignia que decía «Measure has not been found».
      #
      # El umbral va **por debajo** del valor actual a propósito. Puesto
      # exactamente en él, cualquier refactor normal rompería la construcción y
      # el equipo aprendería a subirlo en vez de a mirarlo.
      - name: Ejecutar pruebas y medir cobertura
        env:
          PIDEUTB_DATABASE_URL_PRUEBAS: postgresql://pideutb@localhost:5432/pideutb_pruebas
        run: |
          pytest -v --junitxml=reporte-pruebas.xml \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      # Si el contenedor no arrancara, las pruebas de PostgreSQL se **omitirían
      # en silencio** y el job seguiría en verde: la suite está escrita para
      # omitirlas cuando no hay base de datos. Este paso convierte ese silencio
      # en un fallo.
      # Cubre los **dos** archivos que dependen de PostgreSQL. Hasta la semana
      # 10 solo vigilaba `test_repositorios.py`, así que la autenticación
      # —que no tiene implementación en memoria a propósito— podría haberse
      # omitido entera sin que este paso se enterara.
      - name: Comprobar que las pruebas de PostgreSQL se ejecutaron
        env:
          PIDEUTB_DATABASE_URL_PRUEBAS: postgresql://pideutb@localhost:5432/pideutb_pruebas
        run: |
          pytest tests/test_repositorios.py tests/test_autenticacion.py -q -rs 2>&1 | tee salida.txt
          if grep -q "Sin PIDEUTB_DATABASE_URL_PRUEBAS" salida.txt; then
            echo "::error::Las pruebas contra PostgreSQL se omitieron. El contenedor no estaba disponible."
            exit 1
          fi

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-py${{ matrix.python-version }}
          path: backend/reporte-pruebas.xml
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Validación del contrato de API.
  #
  # Tres capas, porque cada una detecta lo que las otras no pueden:
  #
  #   1. Spectral  — ¿es un OpenAPI 3.1 / AsyncAPI 3.0 válido y bien formado?
  #   2. oasdiff   — ¿rompe a alguien respecto de la versión publicada?
  #   3. pytest    — ¿lo cumple el código, y sigue emitiendo lo que el
  #                  consumidor declaró que lee? (corre en el job `pruebas`)
  #
  # Las dos primeras no tocan `requirements-ci.txt`: Spectral entra por npm y
  # oasdiff por su imagen oficial, así que el lock con hashes del backend
  # sigue siendo el único origen de dependencias de Python.
  # --------------------------------------------------------------------------
  contrato:
    name: Contrato de API
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Se instala explícitamente en lugar de dejar que `npx` lo descargue
      # sobre la marcha: `npx` resuelve el paquete en el momento de usarlo y
      # ejecuta sus scripts de instalación, que es código de terceros corriendo
      # con los permisos del runner. `--ignore-scripts` los desactiva, y la
      # versión exacta evita que la construcción cambie sola.
      - name: Instalar Spectral
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            @stoplight/spectral-cli@6.15.0

      # `--fail-severity=warn` y no `error`: con el umbral en `error` la
      # validación solo se activaría ante un archivo roto, que es el caso que
      # nunca ocurre. Los avisos son los que detectan la degradación real.
      - name: Validar la forma de los contratos (Spectral)
        run: |
          ./node_modules/.bin/spectral lint \
            docs/api/openapi.yaml \
            docs/api/asyncapi.yaml \
            --ruleset .spectral.yaml \
            --fail-severity=warn

      # Compara el contrato vigente con la última versión congelada. Falla si
      # introduce una rotura sin haber subido la versión mayor.
      # La misma comprobación, con las reglas explicadas una a una, está en
      # backend/tests/test_compatibilidad_contrato.py; tener las dos no es
      # redundancia: una herramienta externa no comparte nuestros puntos
      # ciegos, y nuestro comparador conoce reglas que ella no puede saber
      # (la dirección del dato en un enum, política §3.1).
      # La línea base es la MAYOR que el contrato declara cumplir, no un
      # literal: con `openapi-1.0.0.yaml` fijo, el salto a 2.0.0 habría dejado
      # este paso comparando contra una promesa que ya nadie hace.
      - name: Resolver la línea base del contrato
        id: linea_base
        run: |
          mayor=$(python -c "import yaml,sys; print(yaml.safe_load(open('docs/api/openapi.yaml'))['info']['version'].split('.')[0])")
          base="docs/api/historial/openapi-${mayor}.0.0.yaml"
          if [ ! -f "$base" ]; then
            echo "::error::El contrato declara la MAYOR ${mayor} y falta su línea base congelada ${base}. Copiá docs/api/openapi.yaml ahí en el mismo commit que sube la versión."
            exit 1
          fi
          echo "ruta=${base}" >> "$GITHUB_OUTPUT"
          echo "Comparando contra ${base}"

      - name: Detectar cambios incompatibles (oasdiff)
        run: |
          docker run --rm -v "${{ github.workspace }}:/specs" tufin/oasdiff breaking \
            "/specs/${{ steps.linea_base.outputs.ruta }}" \
            /specs/docs/api/openapi.yaml \
            --fail-on ERR

  # --------------------------------------------------------------------------
  # Análisis estático y Quality Gate.
  #
  # El escaneo se omite —sin fallar— mientras no exista el secreto
  # `SONAR_TOKEN`, para que la ausencia de configuración no tumbe el pipeline.
  # En cuanto el secreto está, el Quality Gate pasa a ser bloqueante.
  # Instrucciones de alta: docs/calidad-sonarcloud.md
  # --------------------------------------------------------------------------
  calidad:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para atribuir cada línea
          # a su commit; con un clon superficial, el análisis de código nuevo
          # queda vacío.
          fetch-depth: 0

      - name: Comprobar si el análisis está configurado
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configurado=si" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta el secreto SONAR_TOKEN; se omite el análisis. Ver docs/calidad-sonarcloud.md"
          fi

      - name: Configurar Python
        if: steps.config.outputs.configurado == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Las dependencias de la aplicación siguen viniendo del lock con hashes.
      # `pytest-cov` se instala aparte y a propósito: es instrumental de este
      # job, no una dependencia del producto, y mezclarlo en el lock obligaría
      # al job `pruebas` a instalarlo sin necesitarlo.
      - name: Instalar dependencias
        if: steps.config.outputs.configurado == 'si'
        working-directory: backend
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          pip install --require-hashes --only-binary=:all: -r requirements-calidad.txt

      - name: Medir cobertura
        if: steps.config.outputs.configurado == 'si'
        working-directory: backend
        run: pytest --cov=app --cov-report=xml:coverage.xml

      # Anclada al SHA del commit y no a la etiqueta `v8`: una etiqueta se
      # puede mover a otro commit sin que nadie se entere, de modo que el
      # pipeline pasaría a ejecutar código distinto del revisado. El SHA no.
      - name: Analizar con SonarCloud
        if: steps.config.outputs.configurado == 'si'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Convierte el Quality Gate en una condición de construcción: sin este
      # paso, SonarCloud publicaría el resultado en su panel y el pipeline
      # seguiría en verde aunque la puerta estuviera en rojo.
      - name: Esperar el veredicto del Quality Gate
        if: steps.config.outputs.configurado == 'si'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --------------------------------------------------------------------------
  # Dependencias
  #
  # Nació de la auditoría de la S13, que encontró dos cosas a la vez:
  #
  #   1. `pytest<=9.0.2` arrastra GHSA-6w46-j5rx-g56g (moderada, vector local).
  #   2. `pytest` viajaba a la imagen de producción, junto con `httpx` y seis
  #      dependencias suyas, sin que la aplicación importe ninguna.
  #
  # La segunda es la que importa. El pipeline no tenía ninguna comprobación de
  # vulnerabilidades, así que la primera podía estar ahí indefinidamente; pero
  # el defecto de fondo era la regla incumplida: en la imagen no debería haber
  # nada que la aplicación no use.
  # --------------------------------------------------------------------------
  dependencias:
    name: Dependencias
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versión exacta, igual que Spectral en el job `contrato`: una
      # herramienta que se resuelve sola cambia el veredicto del pipeline sin
      # que nadie lo haya decidido.
      #
      # Y `--only-binary=:all:`, que la primera versión de este job olvidaba.
      # Lo señaló SonarCloud (githubactions:S8541) y tenía razón: sin esa
      # opción pip puede construir desde fuentes, y construir ejecuta el script
      # de instalación del paquete — código de terceros corriendo con los
      # permisos del runner.
      #
      # Que se olvidara **aquí** es lo llamativo: es el job que audita
      # dependencias, y se instalaba a sí mismo sin la salvaguarda que el resto
      # del proyecto exige (`backend/Dockerfile`, los tres locks). La regla no
      # vale menos por aplicarse al instrumental.
      - name: Instalar pip-audit
        run: |
          python -m pip install --no-cache-dir --only-binary=:all:             pip-audit==2.7.3

      # `--no-deps` porque el lock ya es la lista completa y resuelta: sin él,
      # pip-audit volvería a resolver el árbol y auditaría versiones que no son
      # las que se instalan.
      #
      # Este paso **bloquea**. Una vulnerabilidad en lo que corre delante de
      # Internet es un problema del producto.
      - name: Auditar las dependencias de producción
        run: |
          python -m pip_audit \
            --requirement backend/requirements-prod.txt \
            --no-deps \
            --progress-spinner=off

      # Este **no** bloquea, y la asimetría es deliberada. Una vulnerabilidad
      # en `pytest` no alcanza a ningún usuario: ese código no se ejecuta en
      # producción, y desde la S13 tampoco se instala allí. Hacerla bloqueante
      # pondría el pipeline en rojo por algo que no pone en riesgo a nadie, y
      # un pipeline que se pone rojo sin motivo acaba ignorado.
      #
      # Se informa porque sigue siendo instrumental que corre en el runner con
      # acceso al repositorio.
      - name: Auditar el instrumental de pruebas (informativo)
        continue-on-error: true
        run: |
          python -m pip_audit \
            --requirement backend/requirements-ci.txt \
            --no-deps \
            --progress-spinner=off

      # La comprobación que sustituye a lo que no se puede hacer en local: no
      # hay Docker en la máquina de desarrollo (deuda D-01 de arc42 §11), así
      # que la imagen no se puede construir para ver si le falta algo.
      #
      # Se instala **solo** el lock de producción en un entorno limpio y se
      # importa la aplicación. Si alguno de los ocho paquetes retirados hiciera
      # falta de verdad, esto falla aquí y no en el arranque del contenedor.
      - name: Verificar que la aplicación arranca con solo el lock de producción
        run: |
          python -m venv /tmp/solo-produccion
          /tmp/solo-produccion/bin/python -m pip install --no-cache-dir \
            --require-hashes --only-binary=:all: \
            -r backend/requirements-prod.txt
          cd backend
          /tmp/solo-produccion/bin/python -c "
          import app.main
          print('app.main importa correctamente')
          "

      # El complemento del paso anterior: comprobar que la retirada es real.
      # Sin esto, un lock que siguiera trayendo pytest pasaría las dos
      # comprobaciones anteriores sin que nada lo señalara.
      # El complemento: comprobar que la retirada es real. Sin esto, un lock
      # que siguiera trayendo pytest pasaría los pasos anteriores sin que nada
      # lo señalara.
      #
      # Se pregunta por lo **instalado** (`importlib.metadata`) y no por lo
      # importable: `packaging` lo vendoriza pip dentro de sí mismo, así que un
      # `import packaging` puede resolverse en un entorno donde el paquete no
      # está instalado, y la comprobación tumbaría la construcción sin motivo.
      - name: Comprobar que el instrumental de pruebas no está en producción
        run: |
          /tmp/solo-produccion/bin/python - <<'FIN'
          from importlib.metadata import distributions

          RETIRADOS = {
              "certifi", "httpcore", "httpx", "iniconfig",
              "packaging", "pluggy", "pygments", "pytest",
          }

          instalados = {d.metadata["Name"].lower().replace("_", "-")
                        for d in distributions()}
          intrusos = sorted(RETIRADOS & instalados)

          if intrusos:
              for p in intrusos:
                  print(f"::error::{p} se instaló con el lock de producción")
              raise SystemExit(1)

          print(f"{len(instalados)} distribuciones instaladas, ninguna de las 8 retiradas")
          FIN

  # --------------------------------------------------------------------------
  # Recorrido de punta a punta, con un navegador de verdad.
  #
  # Lo que añade a los 515 tests del job `pruebas`: un navegador. Aquellos
  # montan la aplicación en memoria y comprueban contratos; ninguno toca un
  # botón, así que ninguno puede ver si el botón está donde se alcanza con el
  # pulgar, si el carrito se vacía al pagar o si el código aparece solo cuando
  # la pasarela confirma.
  #
  # No es hipotético: el rediseño de la semana 15 destapó tres defectos de esa
  # clase —el carrito seguía lleno después de pagar, la barra pegajosa se
  # quedaba debajo del pie en escritorio, y el botón del carrito dependía de
  # tres `<span>` anidados para tener nombre accesible— y la suite entera
  # seguía en verde con los tres dentro.
  #
  # Levanta el sistema completo: PostgreSQL, la API, el sitio estático y la
  # pasarela simulada. Es el job más lento del workflow (~3 min) y es el único
  # que prueba que las piezas encajan.
  # --------------------------------------------------------------------------
  recorrido:
    name: Recorrido con navegador
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: pideutb
          POSTGRES_DB: pideutb
          # Mismo motivo que en el job `pruebas`: el contenedor vive dentro del
          # job y se destruye al terminar, así que una contraseña aquí sería una
          # credencial de repositorio que no protege nada.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pideutb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PIDEUTB_DATABASE_URL: postgresql://pideutb@localhost:5432/pideutb
      PIDEUTB_SECRETO_PASARELA: secreto-solo-de-este-job
      PIDEUTB_ORIGENES_PERMITIDOS: http://127.0.0.1:8080
      # Sin esto, `/v1/pagos/simulador/{ref}` responde 404 y el recorrido no
      # puede aprobar ningún cobro. El propio spec lo dice en su mensaje de
      # error, para que el fallo se lea como «falta una variable» y no como
      # «la pasarela está rota».
      PIDEUTB_URL_PASARELA_SIMULADA: http://127.0.0.1:8080/pasarela.html
      PIDEUTB_TOKEN_REINICIO_DEMO: token-solo-de-este-job
      PIDEUTB_SITIO: http://127.0.0.1:8080
      PIDEUTB_API: http://127.0.0.1:8000
      PIDEUTB_MOSTRADOR_CORREO: mostrador@utb.edu.co
      # Credencial de un usuario que solo existe dentro de este job, contra una
      # base que se destruye al terminar. Cumple el mínimo de longitud que
      # exige `crear_usuario`, que es el único motivo de que sea tan larga.
      PIDEUTB_MOSTRADOR_CONTRASENA: contrasena-solo-de-este-job
      PIDEUTB_NIVEL_LOG: WARNING

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Instalar dependencias de la API
        working-directory: backend
        # Escalar de bloque y no en línea: `--only-binary=:all: -r` lleva dos
        # puntos seguidos de espacio, que YAML interpreta como separador de
        # clave y hace ilegible el archivo entero.
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-ci.txt

      # El mismo orden que `entrypoint.sh`: primero el esquema, después la
      # cuenta. Al revés, la migración 008 no tendría nada que mover y la cuenta
      # se crearía donde dijera el entorno.
      - name: Aplicar migraciones
        working-directory: backend
        run: python scripts/migrar.py

      # El establecimiento es el mismo que `sitio/config.js`, y hay una prueba
      # que compara esos dos números (`test_escenarios_de_calidad.py`). Aquí se
      # lee del propio archivo para que este job no pueda quedarse atrás si
      # cambian: si se escribiera a mano, el recorrido seguiría pasando contra
      # el establecimiento viejo.
      - name: Sembrar la cuenta del mostrador
        working-directory: backend
        run: |
          # `grep -o` y `tr`, sin expresiones de Perl ni retrorreferencias.
          #
          # El primer intento usaba `grep -oP ... \K\d+`, que no está en todos
          # los `grep` —en esta máquina de desarrollo falla con «-P supports
          # only unibyte and UTF-8 locales»—, y el segundo un `sed` con una
          # retrorreferencia que, al escribirla desde un guion, acabó metiendo
          # un carácter de control 0x01 en el YAML y dejó el workflow entero
          # ilegible.
          #
          # Esto no lleva ni una barra invertida, así que no hay nada que
          # escapar mal, y se puede comprobar en cualquier parte.
          ESTABLECIMIENTO=$(grep -o 'ESTABLECIMIENTO_ID: [0-9]*' ../sitio/config.js | tr -dc '0-9')
          if [ -z "$ESTABLECIMIENTO" ]; then
            echo "::error::No se pudo leer ESTABLECIMIENTO_ID de sitio/config.js"
            exit 1
          fi
          echo "Establecimiento del sitio: $ESTABLECIMIENTO"
          PIDEUTB_USUARIO_INICIAL_CORREO="$PIDEUTB_MOSTRADOR_CORREO" \
          PIDEUTB_USUARIO_INICIAL_CONTRASENA="$PIDEUTB_MOSTRADOR_CONTRASENA" \
          PIDEUTB_USUARIO_INICIAL_ESTABLECIMIENTO="$ESTABLECIMIENTO" \
            python scripts/sembrar_usuario_inicial.py

      - name: Levantar la API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "API arriba"; exit 0
            fi
            sleep 1
          done
          echo "::error::La API no respondió en 30 s"
          cat /tmp/api.log
          exit 1

      # `http.server` y no nginx: lo que se prueba es el sitio, no su
      # contenedor. Las cabeceras de nginx ya las comprueba
      # `test_escenarios_de_calidad.py` leyendo el `nginx.conf`, y levantar
      # Docker aquí añadiría dos minutos para verificar lo mismo.
      - name: Servir el sitio
        working-directory: sitio
        run: |
          nohup python -m http.server 8080 --bind 127.0.0.1 > /tmp/sitio.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/index.html > /dev/null; then
              echo "Sitio arriba"; exit 0
            fi
            sleep 1
          done
          echo "::error::El sitio no respondió en 20 s"
          exit 1

      # Comprueba la cadena por HTTP antes de gastar tres minutos de navegador.
      # Si algo está mal conectado, este paso lo dice en un eslabón concreto y
      # el informe de Playwright no hace falta leerlo.
      - name: Verificar la cadena antes del navegador
        working-directory: backend
        run: python scripts/verificar_flujo.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Ejecutar el recorrido
        working-directory: e2e
        run: npx playwright test

      # Las trazas solo se guardan de lo que falla (`retain-on-failure`), así
      # que este artefacto está vacío cuando todo va bien y contiene el
      # navegador paso a paso cuando no.
      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorrido-navegador
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Registro de la API si algo falló
        if: failure()
        run: cat /tmp/api.log
