name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# El job solo clona el repositorio y ejecuta pruebas: no necesita permisos de
# escritura. Se declara el mínimo en lugar de heredar los del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v --junitxml=reporte-pruebas.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-py${{ matrix.python-version }}
          path: backend/reporte-pruebas.xml
          if-no-files-found: ignore
