# Expectativas del consumidor sobre la API de PideUTB.
#
# Esto NO es el contrato. El contrato es docs/api/openapi.yaml y lo escribe el
# proveedor. Este archivo es lo contrario: lo escribe **quien consume**, y dice
# qué parte del contrato usa de verdad.
#
# Sirve para dos cosas que el contrato solo no puede hacer:
#
# 1. Que el pipeline del proveedor falle si deja de emitir un campo del que
#    alguien depende, aunque el cambio parezca inocuo desde el lado del
#    proveedor.
# 2. Que el proveedor sepa qué puede retirar sin romper a nadie. Un campo que
#    ningún consumidor declara aquí se puede quitar; uno declarado, no.
#
# Cuando el frontend deje de usar un campo, se borra de aquí. Ese borrado es lo
# que le da permiso al proveedor para retirarlo.
#
# Lo verifica: backend/tests/test_expectativas_consumidor.py

consumidor: frontend-web
descripcion: >
  Interfaz web que consumen los tres roles del sistema (usuario, personal del
  establecimiento y administrador). Es el contenedor "Frontend Web" del
  diagrama C4 de nivel 2.

# Rango de versiones del contrato con el que este consumidor sabe hablar.
# Que sea `3.x` y no `3.0.0` es la consecuencia práctica de la política de
# versionado: los cambios MENOR son compatibles por definición, así que el
# consumidor no necesita tocarse. Un salto a `4.x` sí exigiría trabajo aquí.
#
# El salto de `2.x` a `3.x` lo motivó el carrito: un pedido pasó de llevar un
# producto a llevar varios, y los campos de producto se movieron a `lineas`
# tanto en la petición como en la respuesta.
#
# El salto de `1.x` a `2.x` es exactamente el trabajo que la política anuncia:
# el panel pasó a necesitar una sesión, y un consumidor de la 1.x deja de
# funcionar contra la 2.0.0. Lo comprueba
# `test_el_consumidor_declara_la_version_mayor_que_publica_el_contrato`, así que
# este campo ya no es decoración.
version_contrato_requerida: "4.x"

operaciones:
  consultarSalud:
    proposito: Comprobar que la API responde antes de mostrar la pantalla inicial.
    campos_leidos: [status]
    # El 503 se declara porque el chequeo pasó a sondear dependencias de verdad
    # (contrato 1.1.0). Añadir un código de respuesta es compatible según
    # `politica-versionado.md`, pero el consumidor tiene que declarar que sabe
    # manejarlo: si no, `test_expectativas_consumidor.py` falla. Eso es lo que
    # hace que un cambio compatible no se cuele sin que nadie lo mire.
    codigos_manejados: ["200", "503"]

  listarItemsDeEstablecimiento:
    proposito: Pintar la carta de un establecimiento.
    campos_leidos:
      - establecimiento_id
      - items[].item_id
      - items[].nombre
      - items[].precio_centavos
      - items[].disponible
      # La foto, la categoría y la descripción se leen desde el contrato 3.0.0.
      # Faltaban aquí: el sitio ya las pintaba sin declararlas, que es
      # exactamente lo que este archivo existe para impedir — el proveedor
      # podría haber retirado `categoria` sin enterarse de que el filtro de la
      # carta se construye con ella.
      - items[].imagen
      - items[].categoria
      - items[].descripcion
      # Desde la 3.1.0. La API resuelve la franja horaria y el sitio solo pinta:
      # `precio_centavos` ya viene con el descuento aplicado, y estos dos son
      # para tachar el precio anterior y decir hasta cuándo.
      - items[].precio_antes_centavos
      - items[].promocion_hasta
    codigos_manejados: ["200", "404"]

  crearPedido:
    proposito: Enviar el carrito y mostrar el resumen de confirmación.
    # Desde la 3.0.0 se envía una lista de líneas. Es el cambio que motiva el
    # salto de MAYOR: `item_id` y `cantidad` dejaron de estar en el nivel de
    # arriba de la petición.
    campos_enviados: [lineas]
    campos_leidos:
      - pedido_id
      - lineas
      - total_centavos
      - estado
      # Desde la 4.0.0. Se entrega una sola vez, aqui, y es con lo que el
      # cliente consulta despues su propio pedido.
      - token_consulta
    codigos_manejados: ["201", "404", "409", "422"]

  iniciarIntentoDePago:
    proposito: Redirigir al usuario a la pasarela.
    campos_enviados: [pedido_id, metodo]
    campos_leidos: [referencia_pago, monto_centavos, estado_pago, url_checkout]
    codigos_manejados: ["201", "404", "409", "422"]

  obtenerIntentoDePago:
    proposito: >
      Distinguir un pago rechazado de uno que todavia no ha confirmado,
      mientras la pantalla de espera sondea. El pedido queda en
      `pendiente_pago` en los dos casos.
    campos_leidos: [estado_pago]
    codigos_manejados: ["200", "404"]

  obtenerPedido:
    proposito: >
      Averiguar en qué quedó el pago al volver de la pasarela. Es la operación
      que existe porque la confirmación llega por un canal asíncrono: sin ella
      el usuario se quedaría mirando una pantalla que nunca cambia.
    campos_leidos: [pedido_id, estado, codigo_canje, total_centavos, lineas]
    # Desde la 4.0.0 hay que mandar el token que devolvio `crearPedido`. Es el
    # salto de MAYOR: antes esta consulta no pedia nada, y como los
    # identificadores son secuenciales cualquiera podia recorrerlos y cosechar
    # los codigos de canje.
    cabeceras_enviadas: ["X-Token-Pedido"]
    codigos_manejados: ["200", "404"]

  # --- Sesiones del panel (contrato 2.0.0) ------------------------------------
  iniciarSesion:
    proposito: >
      Cambiar correo y contraseña por el token con el que se opera el panel.
      Es nueva en la 2.0.0 y es la razón del salto de MAYOR.
    campos_enviados: [correo, contrasena]
    campos_leidos: [token, usuario.rol, usuario.establecimiento_id]
    # El `401` no se trata como error genérico: es el caso normal de quien
    # escribe mal la contraseña, y la respuesta es volver a pedirla con un
    # mensaje que **no** distinga entre correo desconocido y clave incorrecta.
    # Un mensaje más útil aquí sería un oráculo de qué correos existen.
    codigos_manejados: ["201", "401", "422"]

  cerrarSesion:
    proposito: Soltar el token al salir, para que no siga sirviendo ocho horas.
    codigos_manejados: ["204", "401"]

  # --- Panel del mostrador (sitio/panel.html) ---------------------------------
  # Mismo consumidor: es el mismo desplegable sirviendo a otro de los tres roles
  # que declara la descripción de arriba.

  listarPedidosDeEstablecimiento:
    proposito: Pintar la cola de pedidos que el mostrador tiene que atender.
    # Ya no se envía `establecimiento_id`: sale de la sesión. El parámetro sigue
    # existiendo en el contrato para los administradores, pero este consumidor
    # dejó de usarlo, y ese borrado es lo que le daría permiso al proveedor para
    # retirarlo si los administradores dejaran de necesitarlo.
    campos_leidos:
      - establecimiento_id
      - pedidos[].pedido_id
      # Desde la 3.0.0 el mostrador pinta una línea por producto, no una por
      # pedido: lo que antes era `nombre_item` y `cantidad` en el nivel de
      # arriba vive ahora dentro de `lineas`.
      - pedidos[].lineas
      - pedidos[].total_centavos
      - pedidos[].estado
      - pedidos[].codigo_canje
    # El `401` se maneja como «la sesión caducó»: vuelve a la pantalla de
    # ingreso en vez de mostrar una cola vacía, que es lo que haría creer al
    # mostrador que no hay pedidos. El `403` no debería ocurrirle a este
    # consumidor —no pide otro establecimiento— pero se declara igual: si
    # ocurriera, significa que el token es de otro rol, y la respuesta correcta
    # también es volver a ingresar.
    codigos_manejados: ["200", "401", "403", "422"]

  cambiarEstadoDePedido:
    proposito: >
      Avanzar el pedido por la máquina de estados del mostrador. El `409` se
      maneja explícitamente y no como error genérico: significa que otra
      persona ya movió el pedido, o que el código de canje no es el de ese
      pedido, y la respuesta del panel es refrescar la lista en vez de insistir.

      Desde la 2.0.0, pasar a `entregado` exige el código que el estudiante
      presenta en el mostrador. Es lo que cierra ESC-04.
    campos_enviados: [estado, codigo_canje]
    campos_leidos: [pedido_id, estado, codigo_canje]
    # El `409` cubre dos causas distintas que el panel trata igual: la
    # transición no corresponde, o el código de canje no coincide. En los dos
    # casos la acción es refrescar la cola y leer el mensaje, no reintentar.
    codigos_manejados: ["200", "401", "403", "404", "409", "422"]

# Valores de `EstadoPedido` que este consumidor sabe interpretar, con lo que
# hace ante cada uno. La lista debe ser EXHAUSTIVA respecto del enum del
# contrato: si el proveedor añade un estado y no aparece aquí, la prueba falla.
#
# Esa es la regla I-8 de la política de versionado hecha comprobable. Sin este
# bloque, «añadir un valor a un enum de respuesta es incompatible» sería una
# afirmación de un documento; con él, es una construcción en rojo.
estados_pedido_interpretados:
  pendiente_pago: Ofrece el botón de pagar.
  pagado: Muestra el código de canje.
  en_preparacion: Muestra "lo están preparando".
  listo_para_recoger: Avisa de que puede pasar a recogerlo.
  entregado: Mueve el pedido al historial.
  cancelado: Muestra el motivo y ofrece repetir el pedido.

# Lo mismo para el estado del intento de pago.
estados_pago_interpretados:
  pendiente: Mantiene la pantalla de espera y vuelve a consultar el pedido.
  aprobado: Muestra el código de canje.
  rechazado: Ofrece reintentar con otro método.

# Métodos que el frontend ofrece. Es un subconjunto legítimo: el consumidor no
# está obligado a usar todo lo que el contrato admite en una petición.
metodos_de_pago_ofrecidos: [tarjeta, nequi, pse]
