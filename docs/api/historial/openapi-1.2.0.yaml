# ============================================================================
# VERSIÓN CONGELADA 1.2.0 — NO EDITAR
#
# Copia inmutable del contrato tal como se publicó. `test_compatibilidad_contrato.py`
# compara el contrato vivo contra `openapi-1.0.0.yaml` —la promesa más antigua
# vigente— y no contra esta, para que no se acumule deriva compatible entre
# versiones consecutivas que en conjunto rompa a un cliente viejo.
#
# Cambios respecto a 1.1.0, todos aditivos (MINOR):
#   · `GET /v1/pedidos` — cola de pedidos de un establecimiento.
#   · `POST /v1/pedidos/{pedido_id}/estado` — máquina de estados del mostrador.
#   · Esquemas `EstadoSolicitable`, `CambiarEstadoRequest` y `ListaDePedidos`.
#
# `EstadoSolicitable` es un `enum` aparte y no `EstadoPedido`: usar el mismo en
# petición y respuesta lo habría dejado bidireccional, y quitarle un valor
# pasaría a ser incompatible por la regla I-7 además de por la I-8.
# ============================================================================

# Contrato de la API pública de PideUTB.
#
# Este archivo es la FUENTE ÚNICA DE VERDAD de la superficie HTTP del sistema.
# Se escribe antes que el código (API-first) y el pipeline falla si el código
# deja de cumplirlo: ver `backend/tests/test_contrato_api.py`.
#
# Reglas de evolución y qué cuenta como cambio incompatible:
#   docs/api/politica-versionado.md
#
# La versión congelada de cada release vive en `docs/api/historial/`, y es
# contra ella que `oasdiff` compara en CI para detectar roturas.

openapi: 3.1.0

info:
  title: PideUTB API
  version: 1.2.0
  summary: Pedidos de comida dentro del campus universitario.
  description: |
    Superficie **síncrona** de PideUTB: consulta de menú, creación y consulta
    de pedidos, e inicio del cobro.

    La confirmación del pago **no ocurre aquí**: llega de forma asíncrona por
    webhook y está descrita en [`asyncapi.yaml`](asyncapi.yaml). El porqué de
    esa separación —y la alternativa descartada— está en
    [ADR-0003](../adr/0003-estrategia-integracion.md).

    ### Unidad monetaria

    Todos los importes son **enteros en centavos de peso colombiano**
    (`100` = 1 COP). No se usan decimales de punto flotante en ningún campo de
    dinero. El nombre de cada campo lleva el sufijo `_centavos` para que la
    unidad viaje en el contrato y no en la documentación: un campo llamado
    `precio` que a veces son pesos y a veces centavos es exactamente la clase
    de ambigüedad que este proyecto ya corrigió en su lenguaje ubicuo
    (arc42 §8.1).

    La elección de la unidad menor no es estética: es la que usa la pasarela de
    pagos, de modo que el número que guarda el pedido y el que se envía a
    cobrar son el mismo, sin conversión intermedia donde perder precisión.

    ### Lectura tolerante

    Un consumidor **debe ignorar los campos que no conozca**. Añadir un campo a
    una respuesta se considera un cambio compatible precisamente bajo esa
    condición; un consumidor que falle ante campos desconocidos rompe esa
    garantía por su cuenta.
  contact:
    name: Equipo PideUTB
    url: https://github.com/ISCOUTB/AS_202620_PideUtb
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:8000
    description: Desarrollo local.
  - url: https://pideutb.vercel.app
    description: Despliegue gestionado (aún no aprovisionado — ver arc42 §7).

tags:
  - name: operacion
    description: |
      Endpoints operativos. **No forman parte de la promesa de compatibilidad
      de `/v1`**: existen para que la plataforma de despliegue compruebe si el
      proceso está vivo, y pueden cambiar sin bump de versión mayor.
  - name: menu
    description: Contexto Catálogo — consulta de ítems por establecimiento.
  - name: pedidos
    description: Contexto Pedidos — creación y consulta de pedidos.
  - name: pagos
    description: |
      Contexto Pagos — inicio del cobro y recepción del evento de la pasarela.
      El primero es síncrono; el segundo es el punto de entrada asíncrono.

paths:
  /health:
    get:
      operationId: consultarSalud
      tags: [operacion]
      summary: Comprueba que el servicio y sus dependencias responden.
      description: |
        Sonda de disponibilidad. **Sondea de verdad** cada dependencia de la
        que el servicio depende y solo reporta las que interrogó: una
        dependencia que no aparece en `dependencias` es una que no se
        comprobó, nunca una que se dio por buena.

        El campo `tipo` de cada entrada evita la lectura optimista: hoy el
        almacenamiento responde `tipo: memoria`, que es la verdad
        (`docs/violaciones.md`, V-09).

        Devuelve `503` cuando alguna dependencia está caída. La plataforma de
        despliegue decide si enruta tráfico leyendo el **código HTTP**, así que
        un `200` con un cuerpo que dijera «mal» la dejaría mandando usuarios a
        un servicio roto.
      responses:
        "200":
          description: Todas las dependencias sondeadas responden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoServicio"
        "503":
          description: Alguna dependencia sondeada no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicioNoDisponible"

  /metricas:
    get:
      operationId: consultarMetricas
      tags: [operacion]
      summary: Latencias observadas por operación.
      description: |
        Percentiles de latencia de las últimas peticiones atendidas, para poder
        hablar con números del escenario **ESC-02** (*el proceso completo de
        pedir toma menos de 2 minutos en el 90 % de los intentos*).

        No mide ESC-02 entera: esos 120 segundos incluyen el tiempo que tarda
        una persona en decidir. Mide la parte del presupuesto que el servidor
        controla, en `p95_ms` de la clave `POST /v1/pedidos`.

        Alcance declarado: mide **un** proceso, sobre una ventana de las
        últimas `ventana_maxima` peticiones, y se reinicia con el servicio. Se
        publica la ventana junto a los datos porque un percentil sin su ventana
        no es interpretable.
      responses:
        "200":
          description: Resumen de latencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metricas"

  /v1/menu/items/{item_id}:
    get:
      operationId: obtenerItemMenu
      tags: [menu]
      summary: Consulta un ítem del menú.
      description: |
        Detalle de un solo ítem. El precio que devuelve es el vigente en el
        catálogo, no el de ningún pedido: una vez creado el pedido, el importe
        que vale es el que quedó congelado en él
        (`docs/violaciones.md`, V-06).
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: El ítem existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMenu"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/menu/establecimientos/{establecimiento_id}/items:
    get:
      operationId: listarItemsDeEstablecimiento
      tags: [menu]
      summary: Lista los ítems que ofrece un establecimiento.
      description: |
        La respuesta es un **objeto con una lista dentro**, no una lista
        desnuda. Devolver `[...]` en la raíz obliga a un cambio incompatible el
        día que haga falta añadir paginación o metadatos; el sobre permite
        añadirlos como campos nuevos, que es un cambio compatible.
      parameters:
        - $ref: "#/components/parameters/EstablecimientoId"
        - name: solo_disponibles
          in: query
          required: false
          description: Si es `true`, omite los ítems marcados como no disponibles.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: |
            Listado del establecimiento. Un establecimiento que existe pero no
            tiene ítems devuelve `200` con `items: []`, no `404`: la ausencia
            de productos no es un error del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaItemsMenu"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/pedidos:
    post:
      operationId: crearPedido
      tags: [pedidos]
      summary: Crea un pedido.
      description: |
        El cliente solo decide **qué ítem** quiere y **cuántos**. El
        establecimiento se deriva del ítem y no se acepta del cliente: aceptarlo
        permitía asignar el pedido a un punto que no vende ese producto
        (`docs/violaciones.md`, V-01).

        Los campos no declarados en la petición **se ignoran** en lugar de
        producir un error. Esa decisión es deliberada y forma parte del
        contrato: un cliente que siga enviando `establecimiento_id` por
        costumbre no se rompe, pero tampoco consigue influir en el resultado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPedidoRequest"
      responses:
        "201":
          description: Pedido creado, a la espera de pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

    get:
      operationId: listarPedidosDeEstablecimiento
      tags: [pedidos]
      summary: Lista los pedidos de un establecimiento.
      description: |
        Los pedidos que el mostrador tiene que atender, del más reciente al más
        antiguo: quien atiende necesita ver arriba lo que acaba de entrar, no lo
        que lleva media hora resuelto.

        Devuelve **todos** los estados, incluidos los ya entregados. Ocultarlos
        obligaría a recordar qué se acaba de entregar para poder corregirse, y
        [ESC-03](../arc42/arc42.md#esc-03) pide resolver en tres interacciones.

        `establecimiento_id` es **obligatorio** y no un filtro opcional: sin él,
        esta ruta devolvería los pedidos de todo el campus a quien preguntara.
      parameters:
        - name: establecimiento_id
          in: query
          required: true
          description: Establecimiento cuyos pedidos se consultan.
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Pedidos del establecimiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDePedidos"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/pedidos/{pedido_id}/estado:
    post:
      operationId: cambiarEstadoDePedido
      tags: [pedidos]
      summary: Avanza el estado de un pedido.
      description: |
        Mueve el pedido dentro de la máquina de estados del mostrador. Es la
        operación que cierra [ESC-03](../arc42/arc42.md#esc-03).

        **Transiciones permitidas:**

        | Desde | Hacia |
        |---|---|
        | `pagado` | `en_preparacion`, `cancelado` |
        | `en_preparacion` | `listo_para_recoger`, `cancelado` |
        | `listo_para_recoger` | `entregado` |

        Dos ausencias son deliberadas:

        - **`pendiente_pago` no es origen de ninguna.** El mostrador **no puede
          marcar un pedido como pagado**: esa transición solo la dispara el
          webhook firmado de la pasarela (`asyncapi.yaml`). Si esta operación
          pudiera hacerla, cualquiera comería gratis, porque todavía no hay
          autenticación (`docs/violaciones.md`, V-10).
        - **`entregado` y `cancelado` son finales.** Volver atrás desde ellos es
          un error de registro, no una operación del negocio, y permitirlo haría
          imposible contar cuántos pedidos se sirvieron.

        Es un sub-recurso con nombre y no un `PATCH` sobre el pedido: `PATCH`
        sugeriría que cualquier campo se puede modificar, y lo único que el
        mostrador puede tocar es el estado. La forma de la ruta dice qué está
        permitido.
      parameters:
        - $ref: "#/components/parameters/PedidoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarEstadoRequest"
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: |
            La transición no está permitida desde el estado actual. Es `409` y
            no `422` porque la petición está bien formada: lo que no encaja es
            el estado del recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDeNegocio"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/pedidos/{pedido_id}:
    get:
      operationId: obtenerPedido
      tags: [pedidos]
      summary: Consulta un pedido y su estado.
      description: |
        Es el endpoint que el frontend consulta tras volver de la pasarela,
        porque la confirmación del pago llega por un canal distinto y puede no
        haber llegado todavía (ver [ADR-0003](../adr/0003-estrategia-integracion.md)
        y arc42 §6.3).
      parameters:
        - $ref: "#/components/parameters/PedidoId"
      responses:
        "200":
          description: El pedido existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/pagos/intentos:
    post:
      operationId: iniciarIntentoDePago
      tags: [pagos]
      summary: Inicia el cobro de un pedido.
      description: |
        Operación **síncrona**: devuelve de inmediato la referencia del intento
        y la URL a la que enviar al usuario. Lo que NO devuelve es el resultado
        del cobro, porque en ese instante todavía no existe.

        Es idempotente por pedido: pedir dos veces el intento del mismo pedido
        devuelve la misma `referencia_pago` mientras siga pendiente, en lugar de
        abrir un segundo cobro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarPagoRequest"
      responses:
        "201":
          description: Intento de pago abierto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentoPago"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/Conflicto"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

  /v1/pagos/eventos:
    post:
      operationId: recibirEventoDePago
      tags: [pagos]
      summary: Recibe la confirmación de la pasarela (webhook).
      description: |
        **Punto de entrada asíncrono del sistema.** Lo invoca la pasarela, no el
        frontend. La semántica del mensaje, sus garantías de entrega y el
        tratamiento de duplicados están en [`asyncapi.yaml`](asyncapi.yaml).

        Responde `202 Accepted` y no `200`: PideUTB acusa recibo del evento, no
        afirma que el efecto de negocio haya terminado. Devolver `200` obligaría
        a procesar de forma síncrona dentro del webhook, que es justo el
        acoplamiento que [ADR-0003](../adr/0003-estrategia-integracion.md)
        evita.

        **La entrega es al-menos-una-vez**: la pasarela reintenta si no recibe
        `2xx`. El mismo evento puede llegar varias veces y el resultado debe ser
        el mismo — de ahí que la respuesta incluya `duplicado`.
      security:
        - FirmaPasarela: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoPago"
      responses:
        "202":
          description: |
            Evento aceptado. Se responde `202` tanto la primera vez como en los
            reintentos: un duplicado no es un error del emisor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcuseDeEvento"
        "401":
          description: Firma ausente o inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDeNegocio"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"

components:
  securitySchemes:
    FirmaPasarela:
      type: apiKey
      in: header
      name: X-Firma-Evento
      description: |
        Firma del cuerpo del evento calculada por la pasarela. Sin ella, el
        endpoint del webhook sería un punto público capaz de marcar pedidos como
        pagados.

  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      description: Identificador del ítem de menú.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    EstablecimientoId:
      name: establecimiento_id
      in: path
      required: true
      description: Identificador del establecimiento.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    PedidoId:
      name: pedido_id
      in: path
      required: true
      description: Identificador del pedido.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    NoEncontrado:
      description: El recurso referenciado no existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDeNegocio"

    Conflicto:
      description: |
        La petición es válida pero el estado actual del sistema no permite
        atenderla (ítem no disponible, establecimiento cerrado, pedido ya
        pagado).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDeNegocio"

    ErrorDeValidacion:
      description: El cuerpo de la petición no cumple el esquema declarado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDeValidacion"

  schemas:
    EstadoDependencia:
      type: object
      description: |
        Resultado de sondear una dependencia. `tipo` es obligatorio porque
        «el almacenamiento respondió» no significa lo mismo si es memoria del
        proceso que si es una base de datos gestionada.
      required: [estado, tipo, latencia_ms]
      properties:
        estado:
          type: string
          enum: [ok, caido]
        tipo:
          type: string
          description: Naturaleza real de la dependencia (`memoria`, `postgresql`, …).
          examples: [memoria, postgresql]
        latencia_ms:
          type: number
          description: Lo que tardó la sonda, no la dependencia en atender tráfico real.
        detalle:
          type: [string, "null"]
          description: Motivo, cuando `estado` es `caido`.

    EstadoServicio:
      type: object
      description: |
        Respuesta del `200`. `status` sigue siendo un `enum` de un solo valor:
        el estado degradado viaja en `ServicioNoDisponible` bajo el `503`, y no
        como un valor más aquí. Añadirlo a este `enum` sería la regla **I-8**
        de [`politica-versionado.md`](politica-versionado.md) —un cliente cuyo
        `if (status === "ok")` funcionaba pasaría a la rama equivocada sin que
        nadie tocara su código.
      required: [status, dependencias]
      properties:
        status:
          type: string
          const: ok
        dependencias:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EstadoDependencia"
      examples:
        - status: ok
          dependencias:
            catalogo: { estado: ok, tipo: memoria, latencia_ms: 0.02, detalle: null }

    ServicioNoDisponible:
      type: object
      description: |
        Respuesta del `503`. Repite la forma de `dependencias` para que el
        diagnóstico no cambie de estructura según el resultado, justo cuando
        menos ganas hay de leer documentación.
      required: [status, dependencias]
      properties:
        status:
          type: string
          const: no_disponible
        dependencias:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EstadoDependencia"
      examples:
        - status: no_disponible
          dependencias:
            base_de_datos: { estado: caido, tipo: postgresql, latencia_ms: 3000.0, detalle: ConnectTimeout }

    ResumenOperacion:
      type: object
      required: [muestras, p50_ms, p95_ms, max_ms]
      properties:
        muestras:
          type: integer
          description: Peticiones dentro de la ventana. Un p95 sobre 3 muestras no significa nada.
        p50_ms: { type: number }
        p95_ms: { type: number }
        max_ms: { type: number }

    Metricas:
      type: object
      required: [ventana_maxima, operaciones]
      properties:
        ventana_maxima:
          type: integer
          description: Cuántas peticiones como máximo entran en el cálculo.
        operaciones:
          type: object
          description: Clave `MÉTODO /ruta/con/{plantilla}`, no la ruta concreta.
          additionalProperties:
            $ref: "#/components/schemas/ResumenOperacion"
      examples:
        - ventana_maxima: 1000
          operaciones:
            "POST /v1/pedidos": { muestras: 120, p50_ms: 14.2, p95_ms: 38.9, max_ms: 91.4 }

    ItemMenu:
      type: object
      description: |
        Representación pública de un ítem del catálogo. No es el modelo interno
        del módulo `menu`: es el lenguaje publicado hacia fuera del sistema
        (arc42 §8.3), y por eso puede evolucionar a distinto ritmo.
      required:
        - item_id
        - establecimiento_id
        - nombre
        - precio_centavos
        - disponible
      properties:
        item_id:
          type: integer
          format: int64
          minimum: 1
        establecimiento_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Referencia opaca. El dueño de los datos del establecimiento es el
            contexto Cuentas (ADR-0002); el catálogo no publica aquí su nombre
            ni su horario.
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        precio_centavos:
          type: integer
          minimum: 0
          description: Precio unitario en centavos de COP.
        disponible:
          type: boolean
      examples:
        - item_id: 1
          establecimiento_id: 1
          nombre: Arepa de huevo
          precio_centavos: 400000
          disponible: true

    ListaItemsMenu:
      type: object
      required: [establecimiento_id, items]
      properties:
        establecimiento_id:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemMenu"

    CrearPedidoRequest:
      type: object
      required: [item_id]
      properties:
        item_id:
          type: integer
          format: int64
          minimum: 1
        cantidad:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
          description: |
            El máximo existe para que un error de tecleo no genere un pedido
            imposible de preparar (`docs/violaciones.md`, V-03). Bajarlo en el
            futuro sería un cambio incompatible: dejaría de aceptarse una
            petición que hoy es válida.
      examples:
        - item_id: 1
          cantidad: 2

    EstadoPedido:
      type: string
      description: |
        Estados por los que pasa un pedido. Es un conjunto cerrado y no texto
        libre (`docs/violaciones.md`, V-08): mientras fuera texto libre, ningún
        consumidor podía saber qué valores debía saber tratar.

        **Quitar un valor de esta lista es un cambio incompatible.** Añadir uno
        también lo es en la práctica, porque un consumidor escrito contra la
        lista anterior no sabe qué hacer con el valor nuevo; por eso la política
        de versionado lo trata como incompatible salvo que se demuestre que
        ningún consumidor discrimina por estado.
      enum:
        - pendiente_pago
        - pagado
        - en_preparacion
        - listo_para_recoger
        - entregado
        - cancelado

    EstadoSolicitable:
      type: string
      description: |
        Estados que **el mostrador** puede pedir. Es un subconjunto de
        `EstadoPedido`, y está separado por dos motivos.

        **De contrato:** `EstadoPedido` viaja en las respuestas. Usarlo también
        en la petición lo dejaría en las dos direcciones, y quitarle un valor
        pasaría a ser incompatible por la regla **I-7** además de por la I-8,
        perdiendo la evolucionabilidad que la política le reconoce a un `enum`
        de respuesta.

        **De seguridad:** al no incluir `pendiente_pago` ni `pagado`, la regla
        de que el mostrador **no puede marcar un pedido como pagado** queda
        escrita aquí, legible sin ejecutar nada. Esa transición solo la dispara
        el webhook firmado de la pasarela.
      enum:
        - en_preparacion
        - listo_para_recoger
        - entregado
        - cancelado

    CambiarEstadoRequest:
      type: object
      description: |
        Estado al que el mostrador quiere llevar el pedido.

        Los dos modos de fallo quedan separados por código, y cada uno dice algo
        distinto: **`422`** significa «ese estado no es algo que puedas pedir»
        —es el caso de `pagado`—, y **`409`** significa «es pedible, pero no
        desde donde está el pedido», con el estado actual en el mensaje.
      required: [estado]
      properties:
        estado:
          $ref: "#/components/schemas/EstadoSolicitable"
      examples:
        - estado: en_preparacion

    ListaDePedidos:
      type: object
      description: |
        Pedidos de un establecimiento, del más reciente al más antiguo.

        Va envuelto en un objeto y no como array en la raíz, por el mismo motivo
        que `ListaDeItems`: con un sobre, añadir paginación o un total más
        adelante es un campo nuevo en una respuesta —cambio compatible—; con un
        array en la raíz sería una rotura.
      required: [establecimiento_id, pedidos]
      properties:
        establecimiento_id:
          type: integer
          minimum: 1
        pedidos:
          type: array
          items:
            $ref: "#/components/schemas/Pedido"

    Pedido:
      type: object
      required:
        - pedido_id
        - establecimiento_id
        - item_id
        - nombre_item
        - precio_unitario_centavos
        - cantidad
        - total_centavos
        - estado
        - codigo_canje
      properties:
        pedido_id:
          type: integer
          format: int64
          minimum: 1
        establecimiento_id:
          type: integer
          format: int64
          minimum: 1
        item_id:
          type: integer
          format: int64
          minimum: 1
        nombre_item:
          type: string
          description: |
            Instantánea del nombre en el momento de la compra. Si el
            establecimiento renombra el producto después, el pedido conserva lo
            que se compró (`docs/violaciones.md`, V-06).
        precio_unitario_centavos:
          type: integer
          minimum: 0
          description: Instantánea del precio en el momento de la compra.
        cantidad:
          type: integer
          minimum: 1
          maximum: 50
        total_centavos:
          type: integer
          minimum: 0
          description: |
            `precio_unitario_centavos × cantidad`. Se publica calculado en lugar
            de dejar que cada consumidor lo multiplique: es el importe que se
            cobra, y debe haber una sola fuente de verdad para él.
        estado:
          $ref: "#/components/schemas/EstadoPedido"
        codigo_canje:
          type: [string, "null"]
          pattern: "^[A-Z0-9]{6}$"
          description: |
            Código que el usuario presenta para recoger el pedido. Es `null`
            mientras el pedido no esté pagado.

            Se declara **siempre presente y anulable** en lugar de opcional: un
            consumidor encuentra la clave siempre y solo tiene que mirar si vale
            `null`. Un campo que a veces no viene obliga a distinguir «ausente»
            de «vacío», que es una fuente clásica de errores en el cliente.
      examples:
        - pedido_id: 1
          establecimiento_id: 1
          item_id: 1
          nombre_item: Arepa de huevo
          precio_unitario_centavos: 400000
          cantidad: 2
          total_centavos: 800000
          estado: pendiente_pago
          codigo_canje: null

    MetodoDePago:
      type: string
      enum: [tarjeta, nequi, pse]

    IniciarPagoRequest:
      type: object
      required: [pedido_id, metodo]
      properties:
        pedido_id:
          type: integer
          format: int64
          minimum: 1
        metodo:
          $ref: "#/components/schemas/MetodoDePago"

    EstadoPago:
      type: string
      enum: [pendiente, aprobado, rechazado]

    IntentoPago:
      type: object
      required:
        - referencia_pago
        - pedido_id
        - monto_centavos
        - estado_pago
        - url_checkout
      properties:
        referencia_pago:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Identificador del intento, generado por PideUTB y no por la
            pasarela. Es la clave con la que se correlaciona el evento que
            llegará después: si la generase la pasarela, no habría forma de
            reconocer el evento antes de recibirlo.
        pedido_id:
          type: integer
          format: int64
          minimum: 1
        monto_centavos:
          type: integer
          minimum: 0
        estado_pago:
          $ref: "#/components/schemas/EstadoPago"
        url_checkout:
          type: string
          format: uri
          description: Destino al que el frontend redirige al usuario.

    EventoPago:
      type: object
      description: |
        Cuerpo del webhook de la pasarela. La descripción completa del mensaje
        —canal, garantías y duplicados— está en `asyncapi.yaml`.
      required: [evento, referencia_pago, estado_pago]
      properties:
        evento:
          type: string
          enum: [transaccion.actualizada]
        referencia_pago:
          type: string
          minLength: 1
          maxLength: 64
        estado_pago:
          $ref: "#/components/schemas/EstadoPago"
        ocurrido_en:
          type: [string, "null"]
          format: date-time
          description: |
            Momento en que la pasarela registró el cambio. Opcional porque el
            sistema no depende de él para decidir: los eventos pueden llegar
            desordenados y el orden se resuelve por estado, no por marca de
            tiempo.

    AcuseDeEvento:
      type: object
      required: [recibido, pedido_id, estado, duplicado]
      properties:
        recibido:
          type: boolean
          const: true
        pedido_id:
          type: integer
          format: int64
          minimum: 1
        estado:
          $ref: "#/components/schemas/EstadoPedido"
        duplicado:
          type: boolean
          description: |
            `true` si este evento ya se había procesado. No es un error: es la
            señal de que la idempotencia funcionó.

    ErrorDeNegocio:
      type: object
      description: |
        Forma de error que emite el framework para los fallos de negocio. Se
        documenta tal como es y no como convendría que fuera: migrar a
        `application/problem+json` (RFC 9457) sería un cambio incompatible y
        requiere `/v2`.
      required: [detail]
      properties:
        detail:
          type: string
      examples:
        - detail: El ítem 999 no existe

    ErrorDeValidacion:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string
