# Servidor del sitio estático.

server {
    # 8080 y no 80: el proceso no corre como root y no puede tomar un
    # puerto privilegiado. El panel enruta hacia aquí.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los logs van a stdout en formato JSON, que es lo que el panel del
    # laboratorio recoge y lo que ya hace la API: tener dos formatos distintos
    # obligaría a leer cada contenedor con ojos distintos.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"sitio","level":"INFO",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"bytes":$body_bytes_sent}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # `config.js` lleva la dirección de la API, así que un navegador que lo
    # guarde en caché seguiría llamando a donde la API ya no está. Es el archivo
    # que más barato es volver a pedir y el más caro de tener desactualizado.
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # El panel no tiene por qué salir en los buscadores: es una pantalla de
    # operación. El `<meta name="robots">` de `panel.html` ya lo dice, y esta
    # cabecera lo repite para quien no ejecute el HTML.
    location = /panel.html {
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri =404;
    }

    # El navegador deja de adivinar el tipo de los archivos. Sin esto, un
    # archivo subido por error con el tipo equivocado puede acabar ejecutándose
    # como script.
    add_header X-Content-Type-Options "nosniff" always;

    # Nadie debería poder embeber este sitio en un marco: es la defensa contra
    # el clickjacking sobre los botones del mostrador.
    add_header X-Frame-Options "DENY" always;

    add_header Referrer-Policy "same-origin" always;
}
