# Servidor del sitio estático.

# --------------------------------------------------------------------------
# `log_format` va AQUÍ, fuera de `server`, y no es un detalle de estilo.
#
# Solo se admite en el contexto `http`. Este archivo se incluye desde
# `conf.d/*.conf`, que ya está dentro de `http`, así que el nivel superior del
# archivo **es** ese contexto; dentro de `server` no lo es.
#
# Puesto dentro, nginx no arranca:
#
#   [emerg] "log_format" directive is not allowed here in default.conf:17
#
# Y como no arranca, el contenedor reinicia en bucle y Traefik se queda sin
# destino. El primer despliegue del laboratorio se fue en encontrar esto. La
# causa de fondo es que esta configuración nunca se ejecutó antes de
# desplegarse: en esta máquina no hay Docker, así que `docker compose up` no
# era una opción y el error solo podía aparecer en el servidor.
# --------------------------------------------------------------------------
log_format json escape=json
    '{"timestamp":"$time_iso8601","service":"sitio","level":"INFO",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"bytes":$body_bytes_sent}';

server {
    # 8080 y no 80: el proceso no corre como root y no puede tomar un
    # puerto privilegiado. El panel enruta hacia aquí.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los logs van a stdout, que es lo que el panel del laboratorio recoge, y
    # con el mismo formato que la API: tener dos formatos distintos obligaría a
    # leer cada contenedor con ojos distintos.
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # **Nada se guarda en caché sin preguntar.** `expires -1` emite
    # `Cache-Control: no-cache`, que no significa «no guardes»: significa
    # «guárdalo, pero pregunta siempre si cambió». Con el `ETag` que nginx ya
    # pone, la respuesta normal es un `304` de unos pocos bytes.
    #
    # ### Por qué hace falta aquí y no en cualquier sitio
    #
    # Este sitio **no tiene paso de construcción** (ver su `Dockerfile`), así
    # que los archivos se llaman siempre igual: no hay `app.a1b2c3.js` que
    # cambie de nombre al cambiar de contenido. Sin eso, la única forma de que
    # un navegador se entere de un despliegue es que pregunte.
    #
    # Sin esta línea, el proxy de delante servía `app.js`, `config.js` y
    # `estilos.css` con `max-age=14400`: **cuatro horas**. Medido contra el
    # despliegue, y no es teórico — quien había abierto el sitio antes seguía
    # viendo la interfaz anterior al carrito, con su `config.js` apuntando al
    # establecimiento viejo, mientras hablaba con la API nueva. El resultado era
    # un `422` y un mensaje de error en una pantalla que ya no existe.
    #
    # El caso más agudo es `config.js`, que lleva la dirección de la API: en
    # caché, el navegador sigue llamando a donde la API ya no está.
    #
    # ### Por qué `expires` y no `add_header Cache-Control`
    #
    # Por lo que se explica abajo en `/panel.html`: `add_header` **interrumpe la
    # herencia** de las cabeceras de seguridad en cuanto un bloque hijo define
    # uno propio. `expires` no, así que esta línea en el nivel del servidor
    # llega a todas las rutas sin dejar ninguna sin proteger.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # El panel no tiene por qué salir en los buscadores: es una pantalla de
    # operación. El `<meta name="robots">` de `panel.html` ya lo dice, y esta
    # cabecera lo repite para quien no ejecute el HTML.
    #
    # **Las tres cabeceras de seguridad se repiten aquí, y no es redundancia.**
    # En nginx, `add_header` **no se hereda** cuando el bloque hijo define uno
    # propio: basta con añadir `X-Robots-Tag` para que las tres de abajo dejen
    # de aplicarse en esta ruta.
    #
    # El efecto era justo el peor posible: la página que las pierde es la del
    # mostrador, la única con sesión y botones que mueven pedidos, y se queda
    # sin `X-Frame-Options: DENY` — que es la defensa contra clickjacking que
    # esos botones necesitan. Y no se nota: la cabecera simplemente no está.
    location = /panel.html {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # La pasarela de pruebas, por lo mismo: fuera de los buscadores. No es una
    # página de PideUTB —representa al sistema que cobra— y en un despliegue sin
    # `PIDEUTB_URL_PASARELA_SIMULADA` no sirve para nada.
    #
    # Las cuatro cabeceras van repetidas y no heredadas por el motivo que
    # explica el bloque de arriba: en nginx, definir una en un bloque hijo
    # cancela **todas** las del padre.
    location = /pasarela.html {
        add_header X-Robots-Tag "noindex, nofollow";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # El navegador deja de adivinar el tipo de los archivos. Sin esto, un
    # archivo subido por error con el tipo equivocado puede acabar ejecutándose
    # como script.
    add_header X-Content-Type-Options "nosniff" always;

    # Nadie debería poder embeber este sitio en un marco: es la defensa contra
    # el clickjacking sobre los botones del mostrador.
    add_header X-Frame-Options "DENY" always;

    add_header Referrer-Policy "same-origin" always;
}
