# Configuración del análisis estático de SonarCloud.
#
# Este archivo es la parte auditable del análisis: sin él, el resultado del
# panel de SonarCloud no se puede reproducir ni revisar, porque nadie sabe qué
# se analizó ni con qué exclusiones.
#
# Alta del proyecto y obtención del token: docs/calidad-sonarcloud.md
#
# Valores verificados contra la propia API de SonarCloud:
#   https://sonarcloud.io/api/components/show?component=ISCOUTB_AS_202620_PideUtb
#
# No siguen la convención que uno supondría: la organización es `isco-utb` con
# guion, y la clave del proyecto NO lleva el guion inicial que sí tenía el
# nombre antiguo del repositorio en GitHub. Copiarlos «a ojo» produce un
# «project not found» que no dice cuál de los dos está mal.
sonar.projectKey=ISCOUTB_AS_202620_PideUtb
sonar.organization=isco-utb
sonar.projectName=PideUTB

# --------------------------------------------------------------------------
# Qué se analiza
# --------------------------------------------------------------------------

# Solo el código de la aplicación. Los scripts de medición y comparación no
# son producto: analizarlos mezclaría su deuda con la del sistema.
sonar.sources=backend/app

# Las pruebas se declaran como pruebas, no como fuente. Si se declararan como
# fuente, Sonar contaría sus aserciones como complejidad del producto y
# penalizaría precisamente al equipo que más prueba.
sonar.tests=backend/tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12

# --------------------------------------------------------------------------
# Cobertura
# --------------------------------------------------------------------------

# Lo genera el job `calidad` de .github/workflows/ci.yml con
# `pytest --cov=app --cov-report=xml`. La ruta es relativa a la raíz del
# repositorio, no a `backend/`.
sonar.python.coverage.reportPaths=backend/coverage.xml

# --------------------------------------------------------------------------
# Exclusiones
# --------------------------------------------------------------------------

# Entornos virtuales y caché: no son código del proyecto y dispararían miles
# de incidencias ajenas que enterrarían las propias.
sonar.exclusions=**/.venv/**,**/.venv-*/**,**/__pycache__/**,**/.pytest_cache/**

# Los seeds en memoria son datos de ejemplo con un `TODO(supabase)` encima:
# se conservan en el análisis a propósito, para que la deuda siga contando.
# Cuando se sustituyan por Supabase, esta línea se puede borrar sin más.
